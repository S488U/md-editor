<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Markdown Parser</title>
  <link rel="stylesheet" href="style.css">
  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Highlight.js Atom Dark Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/atom-one-dark.min.css">
</head>

<body class="h-full w-full bg-[#1e1e1e] text-white flex flex-col lg:flex-row overflow-hidden font-[system-ui,Arial,sans-serif]">

  <!-- Editor -->
  <div class="relative w-full lg:w-1/2 flex flex-col items-center p-4 h-[50vh] lg:h-full">
    <textarea id="markdown" placeholder="Type your Markdown here..."></textarea>
  </div>

  <!-- Output -->
  <div id="preview" class="relative w-full lg:w-1/2 p-4 overflow-y-auto h-[50vh] lg:h-full border-t border-gray-800 lg:border-t-0 lg:border-l">
    <button id="copyBtn">Copy</button>
    <div id="output" class="markdown-content mt-8 text-gray-100"></div>
  </div>

  <!-- Drawer Toggle -->
  <div id="drawerToggle">
    <svg width="30px" height="30px" viewBox="0 0 24.00 24.00" fill="none" xmlns="http://www.w3.org/2000/svg"
      stroke="#999999" transform="rotate(0)" stroke-width="2.4">
      <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
      <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
      <g id="SVGRepo_iconCarrier">
        <path opacity="0.5"
          d="M3.46447 20.5356C4.92893 22.0001 7.28595 22.0001 12 22.0001C16.714 22.0001 19.0711 22.0001 20.5355 20.5356C22 19.0711 22 16.714 22 12C22 7.28595 22 4.92893 20.5355 3.46447C19.0711 2 16.714 2 12 2C7.28595 2 4.92893 2 3.46447 3.46447C2 4.92893 2 7.28602 2 12.0001C2 16.7141 2 19.0711 3.46447 20.5356Z"
          fill="#999999"></path>
        <path
          d="M7.7649 9.89758C7.7503 9.64424 7.75 9.30433 7.75 8.8076V2.06874C8.9058 2 10.2996 2 12 2C13.7004 2 15.0942 2 16.25 2.06874V8.8076C16.25 9.30433 16.2497 9.64424 16.2351 9.89758C16.22 10.1601 16.1923 10.2408 16.1854 10.2563C16.0383 10.5876 15.6753 10.7662 15.323 10.6807C15.3066 10.6767 15.2257 10.6493 15.0085 10.5012C14.7989 10.3582 14.5294 10.151 14.1358 9.848L14.0688 9.79636C13.6986 9.51094 13.4101 9.28851 13.0958 9.15196C12.3968 8.84828 11.6032 8.84828 10.9042 9.15196C10.5899 9.28851 10.3014 9.51094 9.9312 9.79636L9.86419 9.848C9.47062 10.151 9.20112 10.3582 8.99148 10.5012C8.77428 10.6493 8.69342 10.6767 8.67695 10.6807C8.32471 10.7662 7.96171 10.5876 7.81457 10.2563C7.80769 10.2408 7.78003 10.1601 7.7649 9.89758Z"
          fill="#999999"></path>
      </g>
    </svg>
  </div>

  <!-- Right Drawer -->
  <div id="drawer">
    <h2>Saved Entries</h2>
    <div id="savedList"></div>
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.3/dist/purify.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
